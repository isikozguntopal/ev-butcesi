<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Aile Bütçesi</title>
  <meta name="description" content="Taksitler, aylık ödemeler, harcamalar, alışveriş listesi" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Aile Bütçesi" />
  <meta name="theme-color" content="#eef3f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#05090a" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8a8a8e;
      --line: #e3e3e8;
      --accent: #0a7c66;
      --accent-soft: #e3f3ef;
      --pos: #1f9d55;
      --neg: #e5484d;
      --warn: #e08a00;
      --fill: #ececf1;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --muted: #98989f;
        --line: #2c2c2e;
        --accent: #3cc6a5;
        --accent-soft: #12332c;
        --pos: #3ccf7a;
        --neg: #ff6b6f;
        --warn: #ffb340;
        --fill: #2c2c2e;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }

    .screen {
      max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px);
    }
    .top { padding: 12px 4px 8px; }
    .top h1 { font-size: 30px; margin: 0; letter-spacing: -.02em; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .month-nav h1 { flex: 1; text-align: center; font-size: 26px; }
    .icon { font-size: 30px; width: 44px; height: 44px; color: var(--accent); border-radius: 22px; }
    .icon:active { background: var(--fill); }
    .demo-badge {
      display: block; width: 100%; text-align: center; font-size: 12px; color: var(--warn); padding: 4px; font-weight: 600;
    }
    .demo-badge.show {
      background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 7px; margin-top: 4px;
    }

    .card { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
    .group { margin-top: 18px; }
    .group-head {
      display: flex; justify-content: space-between; padding: 0 16px 6px;
      font-size: 13px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted);
    }
    .group .card { margin-bottom: 0; }

    .hero { padding: 16px; }
    .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
    .pos { color: var(--pos); }
    .neg { color: var(--neg); }
    .warn { color: var(--warn); }
    .muted { color: var(--muted); }
    .rows { padding: 0 16px; }
    .hero .rows { padding: 0; margin-top: 6px; }
    .row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 11px 0; border-top: 1px solid var(--line);
    }
    .rows .row:first-child { border-top: 0; }
    .hero .rows .row:first-child { border-top: 1px solid var(--line); }
    .row.pad { padding: 12px 16px; }
    .row b { font-variant-numeric: tabular-nums; }

    .item {
      display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 52px;
      border-top: 1px solid var(--line); cursor: pointer;
    }
    .card > .item:first-child { border-top: 0; }
    .item.tall { padding: 12px 16px; }
    .grow { flex: 1; min-width: 0; }
    .title { font-weight: 500; overflow-wrap: anywhere; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .tag { color: var(--accent); }
    .done { color: var(--muted); text-decoration: line-through; }
    .amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .line { display: flex; justify-content: space-between; gap: 8px; }
    .bullet { width: 8px; height: 8px; border-radius: 4px; background: var(--fill); margin: 0 9px; flex: none; }
    .check {
      flex: none; width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--muted);
      display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #fff;
    }
    .check.on { background: var(--pos); border-color: var(--pos); }
    .bar { height: 6px; background: var(--fill); border-radius: 3px; margin: 8px 0 6px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); border-radius: 3px; }
    .bar > div.full { background: var(--pos); }
    .empty { padding: 14px 16px; color: var(--muted); font-size: 15px; }
    .pill {
      flex: none; padding: 5px 12px; border-radius: 14px; font-size: 14px; font-weight: 600;
      background: var(--fill); color: var(--accent);
    }
    .pill.on { background: var(--accent-soft); color: var(--accent); }
    .del { color: var(--neg); font-weight: 600; }
    .code {
      font-family: ui-monospace, Menlo, monospace; font-weight: 700; letter-spacing: .1em;
      background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 8px;
    }

    .seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; margin: 4px 0 12px; }
    .seg button { flex: 1; padding: 7px 4px; border-radius: 8px; font-size: 14px; font-weight: 500; }
    .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

    .search { display: flex; align-items: center; gap: 8px; padding: 4px 16px; }
    .search input { flex: 1; border: 0; background: none; padding: 10px 0; outline: none; min-width: 0; }

    .form .field, .group .field {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 16px; min-height: 48px; border-top: 1px solid var(--line);
    }
    .form .field:first-child, .group .card > .field:first-child { border-top: 0; }
    .field > input, .field > select {
      flex: 1; border: 0; background: none; padding: 12px 0; outline: none; min-width: 0;
    }
    .field > span + input, .field > span + select { text-align: right; text-align-last: right; }
    .field.col { flex-direction: column; align-items: stretch; padding: 12px 16px 4px; }
    .field.col .seg { margin-bottom: 8px; }
    .field small { display: block; font-size: 12px; color: var(--muted); }
    .field.toggle input { flex: none; width: 22px; height: 22px; accent-color: var(--accent); }
    .money { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
    .money input {
      border: 0; background: none; outline: none; text-align: right; width: 100%; padding: 12px 0;
      font-variant-numeric: tabular-nums;
    }
    .group-head.fold { width: 100%; text-align: left; align-items: center; padding-top: 4px; padding-bottom: 8px; }
    .chev { display: inline-block; width: 14px; margin-right: 4px; font-size: 16px; transition: transform .2s; }
    .chev.open { transform: rotate(90deg); }
    .check.warn { border-color: var(--warn); color: var(--warn); }
    .check.on:not(:empty) { font-size: 13px; }
    .banner {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--accent-soft); color: var(--text); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
    }
    .banner .sub { display: block; }
    .banner-icon { font-size: 26px; }
    .lead { font-size: 17px; font-weight: 600; margin: 4px 4px 12px; }
    .month-nav.small h2 { flex: 1; text-align: center; margin: 0; font-size: 20px; }
    .center-text { text-align: center; }
    .center-text .rows { text-align: left; }
    .transfer { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; margin-top: 6px; flex-wrap: wrap; }
    .transfer .arrow { color: var(--accent); font-size: 22px; }
    .who { font-weight: 600; margin-right: 10px; }
    .who.ok { color: var(--pos); }
    .who.no { color: var(--warn); }
    .hero .month-nav.small { margin: -6px -6px 0; }
    .hero .empty { padding: 14px 0; }
    .bar-row { padding: 10px 16px; border-top: 1px solid var(--line); }
    .card > .bar-row:first-child { border-top: 0; }
    .hbar { height: 8px; background: var(--fill); border-radius: 4px; margin: 6px 0 2px; overflow: hidden; }
    .hbar > div { height: 100%; background: var(--accent); border-radius: 4px; }
    .total-row { border-top: 1px solid var(--line); background: var(--fill); }
    .link-row { width: 100%; text-align: left; color: var(--accent); font-weight: 600; flex-wrap: wrap; gap: 2px 10px; }
    .link-row .sub { font-weight: 400; }
    .method { background: var(--card); border-radius: 14px; margin-bottom: 12px; padding-bottom: 10px; }
    .method small { display: block; margin-top: -4px; }
    .sub-head { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .sub-head .link { padding: 4px 0; font-size: 17px; }
    .menu-item { width: 100%; text-align: left; gap: 14px; min-height: 64px; }
    .menu-item .grow > span { display: block; }
    .menu-icon { font-size: 26px; width: 34px; text-align: center; flex: none; }
    .chev-r { color: var(--muted); font-size: 22px; flex: none; }
    .help-img { width: 100%; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.12); margin-bottom: 12px; }
    .help h2 { font-size: 20px; margin: 4px 0 6px; }
    .help p { margin: 0 0 8px; line-height: 1.5; color: var(--text); }
    .help-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 12px; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--fill); display: block; cursor: pointer; }
    .dots i.on { background: var(--accent); width: 18px; }
    .carousel { overflow: hidden; margin: 0 -16px; }
    .track { display: flex; width: 200%; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
    .page { width: 50%; flex: none; padding: 0 16px; box-sizing: border-box; }
    .page-dots { justify-content: center; margin: 4px 0 12px; }
    .page-dots i { width: 8px; height: 8px; border-radius: 4px; }
    .page-dots i.on { width: 20px; }
    .gauge { padding: 4px 0 2px; }
    .gauge-limit { font-size: 36px; margin: 2px 0 10px; }
    .gauge-bar { height: 12px; border-radius: 6px; background: var(--fill); overflow: hidden; }
    .gauge-bar > div { height: 100%; border-radius: 6px; transition: width .4s ease, background .4s ease; }
    .gauge-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
    .gauge-row b { color: var(--text); font-variant-numeric: tabular-nums; }
    .gauge-avail { font-size: 15px; }
    .g-total { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
    .g-total.pos, .amt.pos, .pos { color: var(--pos); }
    .g-total.neg, .amt.neg, .neg { color: var(--neg); }
    .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
    .quick { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 8; display: flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 6px 18px 6px 6px; font-weight: 600; font-size: 15px;
      box-shadow: 0 8px 22px rgba(0,0,0,.22); touch-action: none; user-select: none; }
    .quick-face { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 26px;
      animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3px) rotate(4deg); } }
    .quick-wrap { position: fixed; right: 0; width: max-content; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 8; display: flex; flex-direction: column;
      align-items: flex-end; gap: 4px; padding-right: 3px; touch-action: none; user-select: none; -webkit-user-select: none; }
    .quick-label { font-size: 11px; font-weight: 400; color: var(--muted); text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); white-space: nowrap; }
    .quick-btn { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 34px; line-height: 1;
      box-shadow: 0 8px 22px rgba(0,0,0,.22); cursor: grab; }
    .bank-actions { justify-content: flex-start; gap: 8px; flex-wrap: wrap; }
    .add-row { width: 100%; margin: 0 0 12px; padding: 14px; background: transparent; color: var(--accent); border: 1.5px dashed var(--accent); border-radius: 16px; font-weight: 600; font-size: 15px; }
    .swipe-row { position: relative; overflow: hidden; }
    .swipe-body { position: relative; background: var(--card); }
    .swipe-del { position: absolute; right: 0; top: 0; bottom: 0; width: 96px; background: var(--neg); color: #fff; border: 0; font-weight: 700; }
    .error {
      background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg);
      font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 12px; margin: 4px 0 12px;
    }
    .hint { font-size: 13px; color: var(--muted); margin: 6px 16px 14px; }
    .center { text-align: center; }

    .link { color: var(--accent); padding: 8px 4px; }
    .link.strong { font-weight: 600; }
    .link.small { font-size: 14px; display: block; margin: 8px auto; }
    .primary, .danger {
      display: block; width: 100%; padding: 14px; border-radius: 14px; font-weight: 600; margin: 14px 0;
    }
    .primary { background: var(--accent); color: #fff; }
    .primary.ghost { background: var(--accent-soft); color: var(--accent); margin-top: 0; }
    .danger { background: var(--card); color: var(--neg); }

    .fab {
      position: fixed; right: max(20px, calc(50% - 260px)); bottom: calc(env(safe-area-inset-bottom) + 76px);
      width: 56px; height: 56px; border-radius: 28px; background: var(--accent); color: #fff;
      font-size: 32px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.2); z-index: 5;
    }

    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
    }
    .tabs button {
      flex: 1; max-width: 112px; display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 7px 0 6px; font-size: 11px; color: var(--muted); filter: grayscale(1); opacity: .75;
    }
    .tabs button.on { color: var(--accent); filter: none; opacity: 1; font-weight: 600; }
    .ti { font-size: 22px; line-height: 1.1; }
    .tabs button.tab-main { flex: 1.25; margin-top: -18px; filter: none; opacity: 1; }
    .tab-main .ti { width: 58px; height: 58px; border-radius: 50%; background: var(--card); display: grid; place-items: center;
      box-shadow: 0 6px 18px rgba(0,0,0,.28); border: 2px solid var(--line, rgba(127,127,127,.25)); }
    .tabs button.tab-main.on .ti { border-color: var(--accent); }
    .tab-main span:last-child { font-size: 12px; }
    .cal { display: flex; flex-direction: column; align-items: center; width: 34px; border-radius: 7px; overflow: hidden; background: #fff; line-height: 1; }
    .cal-m { width: 100%; background: #e5484d; color: #fff; font-size: 8px; font-weight: 700; padding: 2px 0; text-align: center; letter-spacing: .5px; }
    .cal-d { color: #111; font-size: 17px; font-weight: 700; padding: 2px 0 3px; }

    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
      border-radius: 16px 16px 0 0; padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
      animation: up .22s ease-out;
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .backdrop.full { align-items: stretch; }
    .backdrop.center { align-items: center; padding: 16px; background: rgba(0,0,0,.6); }
    .modal { background: var(--card); width: 100%; max-width: 420px; max-height: 88vh; overflow: auto; overscroll-behavior: contain;
      border-radius: 24px; padding: 16px 18px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); animation: pop .2s ease-out; }
    @keyframes pop { from { transform: scale(.94); opacity: 0; } }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; text-align: left; font-size: 14px; }
    .modal-kind { font-size: 15px; color: var(--muted); }
    .modal-amount { font-size: 44px; font-weight: 800; margin: 6px 0 4px; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
    .modal-who { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
    .modal-bal { margin: 16px 0 0; padding: 12px 14px; background: var(--bg); border-radius: 14px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .modal-actions { display: grid; gap: 8px; margin-top: 16px; }
    .modal-actions button { width: 100%; margin: 0; }
    .modal-list { text-align: left; margin-top: 12px; background: var(--bg); border-radius: 14px; }
    .modal-nav { display: flex; justify-content: space-between; margin-top: 12px; }
    .modal-nav button:disabled { opacity: .35; }
    .item.tappable { cursor: pointer; }
    .center-block { display: block; margin: 8px auto 0; }
    .receipt-box { display: grid; gap: 8px; justify-items: center; padding: 12px; }
    .receipt-thumb { display: block; max-width: 100%; max-height: 260px; border-radius: 12px; margin: 0 auto 8px; object-fit: contain; cursor: zoom-in; }
    .viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: grid; place-items: center; overflow: hidden; touch-action: none; }
    .viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; transform-origin: center; will-change: transform; user-select: none; -webkit-user-select: none; }
    .viewer-close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; width: 40px; height: 40px; border-radius: 50%;
      border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 20px; }
    .viewer-hint { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 18px); left: 0; right: 0; text-align: center; color: rgba(255,255,255,.6); font-size: 13px; }
    .item.tappable:active { background: var(--accent-soft); }
    .sheet.full { max-height: none; height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top); animation: slide .22s ease-out; }
    @keyframes slide { from { transform: translateX(30px); opacity: 0; } }
    .sheet-head {
      position: sticky; top: 0; background: var(--bg); z-index: 1;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 12px;
    }
    .sheet-head > :first-child { justify-self: start; }
    .sheet-head > :last-child { justify-self: end; }
    .sheet-body { padding: 4px 16px 8px; }

    .welcome {
      max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
      padding: calc(env(safe-area-inset-top) + 24px) 16px 24px; text-align: center;
    }
    .welcome h1 { margin: 4px 0; font-size: 32px; }
    .welcome .card, .welcome .seg { text-align: left; margin-top: 12px; }
    .logo { font-size: 56px; display: inline-block; animation: giggle .6s ease-in-out infinite alternate; }

    /* ---------- Hayvancıklar ---------- */
    .buddy-wrap { display: flex; align-items: center; gap: 12px; margin: 2px 2px 14px; }
    .buddy {
      position: relative; flex: none; width: 66px; height: 66px; font-size: 46px; line-height: 1;
      display: grid; place-items: center;
    }
    .buddy .face { display: inline-block; transform-origin: 50% 90%; }
    .buddy .prop { position: absolute; line-height: 1; pointer-events: none; }
    .bubble {
      position: relative; flex: 1; background: var(--card); padding: 10px 14px; border-radius: 18px;
      font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.06); animation: pop .35s ease-out;
    }
    .bubble::before {
      content: ''; position: absolute; left: -7px; top: 50%; margin-top: -7px;
      border: 7px solid transparent; border-right-color: var(--card); border-left: 0;
    }

    .act-wave .face { animation: tilt 1.1s ease-in-out 2; }
    .hand { right: -8px; top: 2px; font-size: 24px; transform-origin: 70% 90%; animation: wave .45s ease-in-out 6 alternate; }
    .act-laugh .face { animation: giggle .22s ease-in-out 10 alternate; }
    .laugh { top: -10px; right: -18px; font-size: 13px; font-weight: 800; color: var(--accent); white-space: nowrap; animation: rise 2.2s ease-out forwards; }
    .act-eat .face { animation: chomp .28s ease-in-out 7 alternate .7s; }
    .food { left: -16px; bottom: 8px; font-size: 22px; animation: feed 2.8s ease-in forwards; }
    .act-poop .face { animation: squat 1.7s ease-in-out; }
    .poop { right: -6px; bottom: -2px; font-size: 18px; opacity: 0; animation: plop 3.6s ease-out .9s forwards; }
    .fart { right: -22px; bottom: 10px; font-size: 14px; opacity: 0; animation: puff 1.3s ease-out .8s forwards; }
    .act-dance .face { animation: dance .38s ease-in-out 8 alternate; }
    .note { top: -8px; right: -10px; font-size: 16px; animation: rise 1.4s ease-out 3; }
    .act-sleep .face { animation: snooze 2.4s ease-in-out infinite; }
    .zzz { top: -8px; right: -12px; font-size: 16px; animation: rise 1.8s ease-out infinite; }
    .act-love .face { animation: pulse .45s ease-in-out 6 alternate; }
    .heart { top: -6px; right: -8px; font-size: 16px; animation: rise 1.4s ease-out 3; }

    @keyframes wave { from { transform: rotate(-20deg); } to { transform: rotate(28deg); } }
    @keyframes tilt { 50% { transform: rotate(-9deg); } }
    @keyframes giggle { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-6px) rotate(5deg); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
    @keyframes chomp { from { transform: scale(1, 1); } to { transform: scale(1.07, .9); } }
    @keyframes feed {
      0% { opacity: 0; transform: translate(-12px, 0); }
      15% { opacity: 1; }
      30% { transform: translate(16px, -8px) scale(1); }
      55% { transform: translate(18px, -8px) scale(.7); }
      75% { transform: translate(18px, -8px) scale(.4); }
      90%, 100% { opacity: 0; transform: translate(18px, -8px) scale(0); }
    }
    @keyframes squat { 30%, 60% { transform: scale(1.1, .84); } 72% { transform: scale(.95, 1.07); } }
    @keyframes plop {
      0% { opacity: 0; transform: translate(-12px, -8px) scale(.2); }
      15% { opacity: 1; transform: translate(4px, 4px) scale(1.25); }
      25% { transform: translate(6px, 4px) scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate(6px, 4px); }
    }
    @keyframes puff { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateX(16px) scale(1.5); } }
    @keyframes dance { from { transform: rotate(-13deg) translateX(-3px); } to { transform: rotate(13deg) translateX(3px); } }
    @keyframes snooze { 50% { transform: rotate(-10deg) scale(.97); } }
    @keyframes pulse { to { transform: scale(1.12); } }
    @keyframes pop { from { opacity: 0; transform: scale(.85); } }

    .empty .mini { display: inline-block; margin-right: 8px; animation: snooze 3s ease-in-out infinite; }

    .walker {
      position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 86px);
      height: 44px; overflow: hidden; pointer-events: none; z-index: 4;
    }
    .walk-track { position: absolute; bottom: 2px; left: -60px; font-size: 30px; line-height: 1; animation: walk 11s linear forwards; }
    .walker.rtl .walk-track { animation-name: walk-rtl; }
    .flip { display: inline-block; }
    .walker.ltr .flip { transform: scaleX(-1); }
    .walk-animal { display: inline-block; animation: step .3s ease-in-out infinite alternate; }
    .walk-prop { position: absolute; top: -12px; left: 22px; font-size: 16px; opacity: 0; animation: stopshow 11s linear forwards; }
    .walk-poop { position: absolute; bottom: 2px; font-size: 17px; line-height: 1; opacity: 0; animation: ground 16s ease-out forwards; }
    .walker.ltr .walk-poop { left: calc(50% - 26px); }
    .walker.rtl .walk-poop { left: calc(50% + 18px); }
    @keyframes walk { 0% { left: -60px; } 40%, 58% { left: calc(50% - 16px); } 100% { left: calc(100% + 60px); } }
    @keyframes walk-rtl { 0% { left: calc(100% + 60px); } 40%, 58% { left: calc(50% - 16px); } 100% { left: -60px; } }
    @keyframes step { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-4px) rotate(4deg); } }
    @keyframes stopshow { 0%, 41% { opacity: 0; } 44%, 56% { opacity: 1; } 59%, 100% { opacity: 0; } }
    @keyframes ground {
      0%, 32% { opacity: 0; transform: translateY(-10px) scale(.2); }
      35% { opacity: 1; transform: scale(1.3); }
      37% { transform: scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    .party {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 130px); z-index: 30;
      display: flex; flex-direction: column; align-items: center; pointer-events: none;
      animation: party 1.9s ease-out forwards;
    }
    .party-animal { font-size: 60px; line-height: 1.1; animation: hop .4s ease-out 4 alternate; }
    .party-text {
      background: var(--accent); color: #fff; padding: 6px 16px; border-radius: 18px; font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,0,0,.18); white-space: nowrap;
    }
    .conf { position: absolute; top: 24px; font-size: 18px; animation: fly 1.2s ease-out forwards; }
    @keyframes party {
      0% { opacity: 0; transform: translate(-50%, 24px) scale(.7); }
      14% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -24px); }
    }
    @keyframes hop { to { transform: translateY(-18px) rotate(8deg); } }
    @keyframes fly { from { opacity: 1; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.1); } }

    @media (prefers-reduced-motion: reduce) {
      .walker { display: none; }
      .buddy *, .party *, .empty .mini, .logo { animation-iteration-count: 1 !important; }
    }

    /* ================= Yeni tasarım (Ekim 2026) =================
       Cam yüzeyler, arka planda dolaşan ışık, kısa ve yaylı hareketler.
       Hesap ve davranış aynı; bu katman sadece görünümü ve hareketi değiştirir. */
    :root {
      --bg: #eef3f1;
      --card: rgba(255, 255, 255, .78);
      --sheet: #f6f9f8;
      --text: #10201b;
      --muted: #6c7c77;
      --line: rgba(16, 32, 27, .08);
      --accent: #0f8f6f;
      --accent-2: #2a9fd6;
      --accent-soft: rgba(15, 143, 111, .12);
      --pos: #15975a;
      --neg: #e0474c;
      --warn: #c97800;
      --fill: rgba(16, 32, 27, .07);
      --rim: rgba(255, 255, 255, .9);
      --shadow: 0 10px 30px rgba(20, 60, 50, .10);
      --glass: rgba(255, 255, 255, .62);
      --btn-ink: #fff;
      --grad: linear-gradient(140deg, #19b089, #0f8f6f);
      --aurora-1: #9fe6cf; --aurora-2: #a9d8f5; --aurora-3: #d6ccf7;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #05090a;
        --card: rgba(255, 255, 255, .06);
        --sheet: #0e1314;
        --text: #f1f6f4;
        --muted: #8d9a97;
        --line: rgba(255, 255, 255, .07);
        --accent: #4fe0b8;
        --accent-2: #8be9ff;
        --accent-soft: rgba(79, 224, 184, .14);
        --pos: #5ee39a;
        --neg: #ff7a7f;
        --warn: #ffbf5a;
        --fill: rgba(255, 255, 255, .08);
        --rim: rgba(255, 255, 255, .13);
        --shadow: 0 10px 30px rgba(0, 0, 0, .35);
        --glass: rgba(255, 255, 255, .07);
        --btn-ink: #04201a;
        --grad: linear-gradient(140deg, #5ff0c6, #29b590);
        --aurora-1: #0f8f6f; --aurora-2: #1d5f8a; --aurora-3: #3a2f7a;
      }
    }

    /* Arka plan ışığı: sabit, bulanık, çok yavaş dolaşır */
    .aurora { position: fixed; inset: -25%; z-index: -1; pointer-events: none; filter: blur(70px); opacity: .55; }
    .aurora i { position: absolute; border-radius: 50%; will-change: transform; animation: drift 22s ease-in-out infinite alternate; }
    .aurora i:nth-child(1) { width: 46vmax; height: 46vmax; left: 12%; top: 6%; background: var(--aurora-1); }
    .aurora i:nth-child(2) { width: 38vmax; height: 38vmax; right: 8%; top: 28%; background: var(--aurora-2); animation-delay: -8s; }
    .aurora i:nth-child(3) { width: 34vmax; height: 34vmax; left: 30%; bottom: 6%; background: var(--aurora-3); animation-delay: -14s; }
    @keyframes drift { to { transform: translate(6vmax, 8vmax) scale(1.15); } }
    /* Işık gövdenin arkasında kalsın diye sadece sayfa kökü boyanır */
    html { background: var(--bg); }
    body { background: transparent; }

    /* Başlıklar */
    .top h1 { font-size: 32px; font-weight: 760; letter-spacing: -.025em; }
    .month-nav h1 { font-size: 28px; }
    .icon { width: 40px; height: 40px; font-size: 24px; display: grid; place-items: center; background: var(--glass);
      border: 1px solid var(--rim); border-radius: 50%; transition: transform .12s var(--spring); }
    .icon:active { transform: scale(.92); background: var(--glass); }
    .icon:disabled { opacity: .25; }

    /* Kartlar: yarı saydam yüzey + parlak kenar + derinlik (bulanıklık sadece birkaç yüzeyde) */
    .card, .method, .bubble {
      background: var(--card); border: 1px solid var(--rim); border-radius: 22px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .12);
    }
    .glass, .tabs, .modal {
      -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    }
    .group-head { font-size: 12.5px; letter-spacing: .06em; padding: 0 6px 8px; }
    .group-head.fold { padding: 4px 6px 8px; }
    .chev { color: var(--accent); }
    .g-total { font-size: 16.5px; }
    .g-note { display: inline-flex; align-items: center; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 650;
      letter-spacing: 0; text-transform: none; color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); vertical-align: 1px; }

    /* Özet üst kartı */
    .hero { padding: 18px; }
    .hero-top { display: flex; align-items: center; gap: 12px; }
    .big { font-size: 42px; font-weight: 780; letter-spacing: -.03em; }
    .hero .big { margin: 2px 0 4px; }
    .ring { width: 84px; height: 84px; flex: none; }
    .ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
    .ring-track { stroke: var(--fill); }
    .ring-val { stroke: url(#ring-g); stroke-dasharray: 100; transition: stroke-dashoffset 1.2s var(--ease-out); }
    .ring-val.over { stroke: var(--neg); }
    @starting-style { .ring-val { stroke-dashoffset: 100 !important; } }
    .ring-num { fill: var(--text); font-size: 16px; font-weight: 750; text-anchor: middle; }
    .ring-sub { fill: var(--muted); font-size: 8.5px; text-anchor: middle; }
    .hero .rows .row { border-top-color: var(--line); }
    .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pos); margin-right: 7px; vertical-align: 1px;
      animation: ping 2.4s infinite; }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pos) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
    .num { font-variant-numeric: tabular-nums; }

    /* Satırlar: ekrana sırayla gelir; basınca hafif tepki */
    .item, .row { border-top-color: var(--line); }
    .item { transition: background .2s ease, transform .12s var(--spring); }
    .item:active { background: var(--accent-soft); }
    .card > .item, .card > div > .item, .ozet-groups .group, .screen > .group, .screen > .card {
      animation: rise .5s var(--ease-out) both;
    }
    .card > :nth-child(2) > .item, .card > .item:nth-child(2), .ozet-groups .group:nth-child(2), .screen > :nth-child(3) { animation-delay: 50ms; }
    .card > :nth-child(3) > .item, .card > .item:nth-child(3), .ozet-groups .group:nth-child(3), .screen > :nth-child(4) { animation-delay: 100ms; }
    .card > :nth-child(4) > .item, .card > .item:nth-child(4), .ozet-groups .group:nth-child(4), .screen > :nth-child(5) { animation-delay: 150ms; }
    .card > :nth-child(5) > .item, .card > .item:nth-child(5), .ozet-groups .group:nth-child(5), .screen > :nth-child(6) { animation-delay: 200ms; }
    .card > :nth-child(n+6) > .item, .card > .item:nth-child(n+6), .ozet-groups .group:nth-child(n+6), .screen > :nth-child(n+7) { animation-delay: 250ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

    /* Grup başlığı: uzun ad sarılır, tutar her zaman tek satırda kalır */
    .group-head { align-items: center; gap: 10px; }
    .group-head > span:first-child { flex: 1; min-width: 0; }
    .g-total { flex: none; white-space: nowrap; }

    /* Yürüyen hayvanlar alt menünün ve ortadaki Özet düğmesinin üstünden geçsin */
    .walker { bottom: calc(env(safe-area-inset-bottom) + 98px); z-index: 11; }

    /* Hedef ve taksit takvimi çubukları: soldan dolar */
    .goal-bar { height: 8px; border-radius: 8px; background: var(--fill); overflow: hidden; margin: 8px 0 6px; }
    .goal-bar i { display: block; height: 100%; border-radius: inherit; transform-origin: left; background: linear-gradient(90deg, var(--pos), var(--accent-2));
      transition: transform 1s var(--ease-out); }
    @starting-style { .goal-bar i { transform: scaleX(0) !important; } }
    .item.goal { cursor: default; }
    .item.goal .grow { cursor: pointer; }
    .cal-row { padding: 12px 16px; border-top: 1px solid var(--line); }
    .card > .cal-row:first-child { border-top: 0; }

    /* Market arama çubuğu */
    .search-label { display: block; font-size: 13px; font-weight: 650; color: var(--muted); margin: 6px 6px 6px; letter-spacing: .02em; }
    .search-bar { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px; border-radius: 18px;
      background: var(--card); border: 1px solid var(--rim); box-shadow: var(--shadow); transition: border-color .2s ease, box-shadow .2s ease; }
    .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
    .search-bar svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
    .search-bar input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; padding: 0; -webkit-appearance: none; appearance: none; }
    .search-bar input::-webkit-search-cancel-button { display: none; }
    .search-clear { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); color: var(--muted); font-size: 12px; flex: none; }
    .search-hint { font-size: 13px; color: var(--muted); margin: 8px 8px 4px; }
    .search-bar + .card { margin-top: 10px; }

    /* Kayıt adı üstte, ayrıntı (ödeme şekli, ortak, durum) altında */
    .item > .grow > .title, .item > .grow > .sub { display: block; }
    .item > .grow > .title { font-weight: 600; }

    /* Durum etiketleri */
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; vertical-align: 1px; }
    .chip.ok { color: var(--pos); background: color-mix(in srgb, var(--pos) 15%, transparent); }
    .chip.wait { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
    .chip svg { width: 11px; height: 11px; }
    .chip svg path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; animation: tick .45s .35s var(--ease-out) forwards; }
    @keyframes tick { to { stroke-dashoffset: 0; } }
    .chip.wait i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .3; } }

    /* Tik kutuları: işaretlenince yaylanır */
    .check { border-width: 2px; transition: background .2s ease, border-color .2s ease, transform .25s var(--spring); }
    .check.on { background: var(--pos); border-color: var(--pos); color: var(--btn-ink); animation: bump .35s var(--spring); }
    @keyframes bump { 50% { transform: scale(1.18); } }

    /* Butonlar */
    .primary { background: var(--grad); color: var(--btn-ink); border-radius: 16px; font-weight: 680;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 30%, transparent), inset 0 1px 0 rgba(255,255,255,.35);
      transition: transform .12s var(--spring), filter .2s ease; }
    .primary:active, .danger:active, .add-row:active, .link-row:active { transform: scale(.97); }
    .primary.ghost { background: var(--fill); color: var(--text); box-shadow: none; }
    .danger { background: var(--card); border: 1px solid var(--rim); border-radius: 16px; transition: transform .12s var(--spring); }
    .add-row { border-radius: 18px; transition: transform .12s var(--spring); }
    .pill, .pill.on { background: var(--accent-soft); color: var(--accent); }

    /* Seçim kutuları (segment) */
    .seg { background: var(--fill); border-radius: 13px; padding: 3px; }
    .seg button { border-radius: 10px; transition: background .2s ease, color .2s ease; }
    .seg button.on { background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.12); border: 1px solid var(--rim); }

    /* Alt menü: yüzen cam kapsül */
    .tabs {
      left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 8px); max-width: 536px; margin: 0 auto;
      border: 1px solid var(--rim); border-radius: 26px; padding: 0 6px; background: var(--glass);
      box-shadow: 0 14px 36px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .tabs button { padding: 9px 0 8px; position: relative; isolation: isolate; transition: color .2s ease, opacity .2s ease; filter: grayscale(.7); }
    .tabs button::before { content: ""; position: absolute; inset: 5px 4px; border-radius: 18px; background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); opacity: 0; transform: scale(.7);
      transition: opacity .2s ease, transform .3s var(--spring); z-index: -1; }
    .tabs button.on::before { opacity: 1; transform: none; }
    .tabs button.on .ti { transform: scale(1.08); }
    .ti { transition: transform .25s var(--spring); }
    .tabs button.tab-main { margin-top: -22px; }
    .tabs button.tab-main::before { display: none; }
    .tab-main .ti { background: var(--sheet); border: 1.5px solid var(--rim); box-shadow: 0 10px 26px rgba(0,0,0,.3); }
    .tabs button.tab-main.on .ti { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), 0 10px 26px rgba(0,0,0,.3); }
    .screen { padding-bottom: calc(env(safe-area-inset-bottom) + 110px); }
    .walker { bottom: calc(env(safe-area-inset-bottom) + 80px); }
    .quick-wrap { bottom: calc(env(safe-area-inset-bottom) + 92px); }
    .quick-btn { background: var(--grad); color: var(--btn-ink); border-radius: 20px; font-weight: 300;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.45);
      transition: transform .12s var(--spring); }
    .quick-btn:active { transform: scale(.93); }

    /* Pencereler: arka plan buğulanır, alt pencere yaylanarak çıkar, ortadaki pencere büyüyerek gelir */
    .backdrop { background: rgba(0,0,0,.32); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .2s ease both; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { background: var(--sheet); border-radius: 26px 26px 0 0; border-top: 1px solid var(--rim);
      animation: sheet-up .42s var(--spring) both; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
    .sheet:not(.full)::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--fill); margin: 8px auto 0; }
    @keyframes sheet-up { from { transform: translateY(60px); opacity: 0; } }
    .sheet.full { animation: slide .32s var(--ease-out) both; }
    .sheet-head { background: var(--sheet); }
    .sheet .card, .sheet .method { box-shadow: none; }
    .modal { background: color-mix(in srgb, var(--sheet) 82%, transparent); border: 1px solid var(--rim); border-radius: 28px;
      animation: pop-in .5s var(--spring) both; box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); }
    @keyframes pop-in { from { opacity: 0; transform: translateY(24px) scale(.94); } }
    .modal-bal, .modal-list { background: var(--fill); }
    .suggest { margin: 14px 0 6px; padding: 14px; border-radius: 18px; display: grid; gap: 8px; text-align: left;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent-2) 8%, transparent));
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); animation: rise .45s .1s var(--ease-out) both; }
    .suggest-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }

    /* Kart görseli: üstünden ışık geçer, limit çubuğu dolar */
    .card-hero { padding: 0; margin-bottom: 12px; }
    .ccard { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; min-height: 190px; color: #fff;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
      background: linear-gradient(135deg, #0f3d35, #12233f 60%, #2a1c4a); border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2); }
    .ccard::after { content: ""; position: absolute; inset: -40% -60%; pointer-events: none;
      background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.15) 50%, transparent 58%);
      transform: translateX(-60%); animation: sweep 6s 1s ease-in-out infinite; }
