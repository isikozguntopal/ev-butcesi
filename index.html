<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Aile Bütçesi</title>
  <meta name="description" content="Taksitler, aylık ödemeler, harcamalar, alışveriş listesi" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Aile Bütçesi" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8a8a8e;
      --line: #e3e3e8;
      --accent: #0a7c66;
      --accent-soft: #e3f3ef;
      --pos: #1f9d55;
      --neg: #e5484d;
      --warn: #e08a00;
      --fill: #ececf1;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --muted: #98989f;
        --line: #2c2c2e;
        --accent: #3cc6a5;
        --accent-soft: #12332c;
        --pos: #3ccf7a;
        --neg: #ff6b6f;
        --warn: #ffb340;
        --fill: #2c2c2e;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }

    .screen {
      max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px);
    }
    .top { padding: 12px 4px 8px; }
    .top h1 { font-size: 30px; margin: 0; letter-spacing: -.02em; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .month-nav h1 { flex: 1; text-align: center; font-size: 26px; }
    .icon { font-size: 30px; width: 44px; height: 44px; color: var(--accent); border-radius: 22px; }
    .icon:active { background: var(--fill); }
    .demo-badge {
      display: block; width: 100%; text-align: center; font-size: 12px; color: var(--warn); padding: 4px; font-weight: 600;
    }
    .demo-badge.show {
      background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 7px; margin-top: 4px;
    }

    .card { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
    .group { margin-top: 18px; }
    .group-head {
      display: flex; justify-content: space-between; padding: 0 16px 6px;
      font-size: 13px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted);
    }
    .group .card { margin-bottom: 0; }

    .hero { padding: 16px; }
    .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
    .pos { color: var(--pos); }
    .neg { color: var(--neg); }
    .warn { color: var(--warn); }
    .muted { color: var(--muted); }
    .rows { padding: 0 16px; }
    .hero .rows { padding: 0; margin-top: 6px; }
    .row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 11px 0; border-top: 1px solid var(--line);
    }
    .rows .row:first-child { border-top: 0; }
    .hero .rows .row:first-child { border-top: 1px solid var(--line); }
    .row.pad { padding: 12px 16px; }
    .row b { font-variant-numeric: tabular-nums; }

    .item {
      display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 52px;
      border-top: 1px solid var(--line); cursor: pointer;
    }
    .card > .item:first-child { border-top: 0; }
    .item.tall { padding: 12px 16px; }
    .grow { flex: 1; min-width: 0; }
    .title { font-weight: 500; overflow-wrap: anywhere; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .tag { color: var(--accent); }
    .done { color: var(--muted); text-decoration: line-through; }
    .amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .line { display: flex; justify-content: space-between; gap: 8px; }
    .bullet { width: 8px; height: 8px; border-radius: 4px; background: var(--fill); margin: 0 9px; flex: none; }
    .check {
      flex: none; width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--muted);
      display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #fff;
    }
    .check.on { background: var(--pos); border-color: var(--pos); }
    .bar { height: 6px; background: var(--fill); border-radius: 3px; margin: 8px 0 6px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); border-radius: 3px; }
    .bar > div.full { background: var(--pos); }
    .empty { padding: 14px 16px; color: var(--muted); font-size: 15px; }
    .pill {
      flex: none; padding: 5px 12px; border-radius: 14px; font-size: 14px; font-weight: 600;
      background: var(--fill); color: var(--accent);
    }
    .pill.on { background: var(--accent-soft); color: var(--accent); }
    .del { color: var(--neg); font-weight: 600; }
    .code {
      font-family: ui-monospace, Menlo, monospace; font-weight: 700; letter-spacing: .1em;
      background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 8px;
    }

    .seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; margin: 4px 0 12px; }
    .seg button { flex: 1; padding: 7px 4px; border-radius: 8px; font-size: 14px; font-weight: 500; }
    .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

    .search { display: flex; align-items: center; gap: 8px; padding: 4px 16px; }
    .search input { flex: 1; border: 0; background: none; padding: 10px 0; outline: none; min-width: 0; }

    .form .field, .group .field {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 16px; min-height: 48px; border-top: 1px solid var(--line);
    }
    .form .field:first-child, .group .card > .field:first-child { border-top: 0; }
    .field > input, .field > select {
      flex: 1; border: 0; background: none; padding: 12px 0; outline: none; min-width: 0;
    }
    .field > span + input, .field > span + select { text-align: right; text-align-last: right; }
    .field.col { flex-direction: column; align-items: stretch; padding: 12px 16px 4px; }
    .field.col .seg { margin-bottom: 8px; }
    .field small { display: block; font-size: 12px; color: var(--muted); }
    .field.toggle input { flex: none; width: 22px; height: 22px; accent-color: var(--accent); }
    .money { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
    .money input {
      border: 0; background: none; outline: none; text-align: right; width: 100%; padding: 12px 0;
      font-variant-numeric: tabular-nums;
    }
    .group-head.fold { width: 100%; text-align: left; align-items: center; padding-top: 4px; padding-bottom: 8px; }
    .chev { display: inline-block; width: 14px; margin-right: 4px; font-size: 16px; transition: transform .2s; }
    .chev.open { transform: rotate(90deg); }
    .check.warn { border-color: var(--warn); color: var(--warn); }
    .check.on:not(:empty) { font-size: 13px; }
    .banner {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--accent-soft); color: var(--text); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
    }
    .banner .sub { display: block; }
    .banner-icon { font-size: 26px; }
    .lead { font-size: 17px; font-weight: 600; margin: 4px 4px 12px; }
    .month-nav.small h2 { flex: 1; text-align: center; margin: 0; font-size: 20px; }
    .center-text { text-align: center; }
    .center-text .rows { text-align: left; }
    .transfer { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; margin-top: 6px; flex-wrap: wrap; }
    .transfer .arrow { color: var(--accent); font-size: 22px; }
    .who { font-weight: 600; margin-right: 10px; }
    .who.ok { color: var(--pos); }
    .who.no { color: var(--warn); }
    .hero .month-nav.small { margin: -6px -6px 0; }
    .hero .empty { padding: 14px 0; }
    .bar-row { padding: 10px 16px; border-top: 1px solid var(--line); }
    .card > .bar-row:first-child { border-top: 0; }
    .hbar { height: 8px; background: var(--fill); border-radius: 4px; margin: 6px 0 2px; overflow: hidden; }
    .hbar > div { height: 100%; background: var(--accent); border-radius: 4px; }
    .total-row { border-top: 1px solid var(--line); background: var(--fill); }
    .link-row { width: 100%; text-align: left; color: var(--accent); font-weight: 600; flex-wrap: wrap; gap: 2px 10px; }
    .link-row .sub { font-weight: 400; }
    .method { background: var(--card); border-radius: 14px; margin-bottom: 12px; padding-bottom: 10px; }
    .method small { display: block; margin-top: -4px; }
    .sub-head { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .sub-head .link { padding: 4px 0; font-size: 17px; }
    .menu-item { width: 100%; text-align: left; gap: 14px; min-height: 64px; }
    .menu-item .grow > span { display: block; }
    .menu-icon { font-size: 26px; width: 34px; text-align: center; flex: none; }
    .chev-r { color: var(--muted); font-size: 22px; flex: none; }
    .help-img { width: 100%; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.12); margin-bottom: 12px; }
    .help h2 { font-size: 20px; margin: 4px 0 6px; }
    .help p { margin: 0 0 8px; line-height: 1.5; color: var(--text); }
    .help-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 12px; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--fill); display: block; cursor: pointer; }
    .dots i.on { background: var(--accent); width: 18px; }
    .error {
      background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg);
      font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 12px; margin: 4px 0 12px;
    }
    .hint { font-size: 13px; color: var(--muted); margin: 6px 16px 14px; }
    .center { text-align: center; }

    .link { color: var(--accent); padding: 8px 4px; }
    .link.strong { font-weight: 600; }
    .link.small { font-size: 14px; display: block; margin: 8px auto; }
    .primary, .danger {
      display: block; width: 100%; padding: 14px; border-radius: 14px; font-weight: 600; margin: 14px 0;
    }
    .primary { background: var(--accent); color: #fff; }
    .primary.ghost { background: var(--accent-soft); color: var(--accent); margin-top: 0; }
    .danger { background: var(--card); color: var(--neg); }

    .fab {
      position: fixed; right: max(20px, calc(50% - 260px)); bottom: calc(env(safe-area-inset-bottom) + 76px);
      width: 56px; height: 56px; border-radius: 28px; background: var(--accent); color: #fff;
      font-size: 32px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.2); z-index: 5;
    }

    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
    }
    .tabs button {
      flex: 1; max-width: 112px; display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 7px 0 6px; font-size: 11px; color: var(--muted); filter: grayscale(1); opacity: .75;
    }
    .tabs button.on { color: var(--accent); filter: none; opacity: 1; font-weight: 600; }
    .ti { font-size: 22px; line-height: 1.1; }

    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
      border-radius: 16px 16px 0 0; padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
      animation: up .22s ease-out;
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .backdrop.full { align-items: stretch; }
    .sheet.full { max-height: none; height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top); animation: slide .22s ease-out; }
    @keyframes slide { from { transform: translateX(30px); opacity: 0; } }
    .sheet-head {
      position: sticky; top: 0; background: var(--bg); z-index: 1;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 12px;
    }
    .sheet-head > :first-child { justify-self: start; }
    .sheet-head > :last-child { justify-self: end; }
    .sheet-body { padding: 4px 16px 8px; }

    .welcome {
      max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
      padding: calc(env(safe-area-inset-top) + 24px) 16px 24px; text-align: center;
    }
    .welcome h1 { margin: 4px 0; font-size: 32px; }
    .welcome .card, .welcome .seg { text-align: left; margin-top: 12px; }
    .logo { font-size: 56px; display: inline-block; animation: giggle .6s ease-in-out infinite alternate; }

    /* ---------- Hayvancıklar ---------- */
    .buddy-wrap { display: flex; align-items: center; gap: 12px; margin: 2px 2px 14px; }
    .buddy {
      position: relative; flex: none; width: 66px; height: 66px; font-size: 46px; line-height: 1;
      display: grid; place-items: center;
    }
    .buddy .face { display: inline-block; transform-origin: 50% 90%; }
    .buddy .prop { position: absolute; line-height: 1; pointer-events: none; }
    .bubble {
      position: relative; flex: 1; background: var(--card); padding: 10px 14px; border-radius: 18px;
      font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.06); animation: pop .35s ease-out;
    }
    .bubble::before {
      content: ''; position: absolute; left: -7px; top: 50%; margin-top: -7px;
      border: 7px solid transparent; border-right-color: var(--card); border-left: 0;
    }

    .act-wave .face { animation: tilt 1.1s ease-in-out 2; }
    .hand { right: -8px; top: 2px; font-size: 24px; transform-origin: 70% 90%; animation: wave .45s ease-in-out 6 alternate; }
    .act-laugh .face { animation: giggle .22s ease-in-out 10 alternate; }
    .laugh { top: -10px; right: -18px; font-size: 13px; font-weight: 800; color: var(--accent); white-space: nowrap; animation: rise 2.2s ease-out forwards; }
    .act-eat .face { animation: chomp .28s ease-in-out 7 alternate .7s; }
    .food { left: -16px; bottom: 8px; font-size: 22px; animation: feed 2.8s ease-in forwards; }
    .act-poop .face { animation: squat 1.7s ease-in-out; }
    .poop { right: -6px; bottom: -2px; font-size: 18px; opacity: 0; animation: plop 3.6s ease-out .9s forwards; }
    .fart { right: -22px; bottom: 10px; font-size: 14px; opacity: 0; animation: puff 1.3s ease-out .8s forwards; }
    .act-dance .face { animation: dance .38s ease-in-out 8 alternate; }
    .note { top: -8px; right: -10px; font-size: 16px; animation: rise 1.4s ease-out 3; }
    .act-sleep .face { animation: snooze 2.4s ease-in-out infinite; }
    .zzz { top: -8px; right: -12px; font-size: 16px; animation: rise 1.8s ease-out infinite; }
    .act-love .face { animation: pulse .45s ease-in-out 6 alternate; }
    .heart { top: -6px; right: -8px; font-size: 16px; animation: rise 1.4s ease-out 3; }

    @keyframes wave { from { transform: rotate(-20deg); } to { transform: rotate(28deg); } }
    @keyframes tilt { 50% { transform: rotate(-9deg); } }
    @keyframes giggle { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-6px) rotate(5deg); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
    @keyframes chomp { from { transform: scale(1, 1); } to { transform: scale(1.07, .9); } }
    @keyframes feed {
      0% { opacity: 0; transform: translate(-12px, 0); }
      15% { opacity: 1; }
      30% { transform: translate(16px, -8px) scale(1); }
      55% { transform: translate(18px, -8px) scale(.7); }
      75% { transform: translate(18px, -8px) scale(.4); }
      90%, 100% { opacity: 0; transform: translate(18px, -8px) scale(0); }
    }
    @keyframes squat { 30%, 60% { transform: scale(1.1, .84); } 72% { transform: scale(.95, 1.07); } }
    @keyframes plop {
      0% { opacity: 0; transform: translate(-12px, -8px) scale(.2); }
      15% { opacity: 1; transform: translate(4px, 4px) scale(1.25); }
      25% { transform: translate(6px, 4px) scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate(6px, 4px); }
    }
    @keyframes puff { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateX(16px) scale(1.5); } }
    @keyframes dance { from { transform: rotate(-13deg) translateX(-3px); } to { transform: rotate(13deg) translateX(3px); } }
    @keyframes snooze { 50% { transform: rotate(-10deg) scale(.97); } }
    @keyframes pulse { to { transform: scale(1.12); } }
    @keyframes pop { from { opacity: 0; transform: scale(.85); } }

    .empty .mini { display: inline-block; margin-right: 8px; animation: snooze 3s ease-in-out infinite; }

    .walker {
      position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 56px);
      height: 44px; overflow: hidden; pointer-events: none; z-index: 4;
    }
    .walk-track { position: absolute; bottom: 2px; left: -60px; font-size: 30px; line-height: 1; animation: walk 11s linear forwards; }
    .walker.rtl .walk-track { animation-name: walk-rtl; }
    .flip { display: inline-block; }
    .walker.ltr .flip { transform: scaleX(-1); }
    .walk-animal { display: inline-block; animation: step .3s ease-in-out infinite alternate; }
    .walk-prop { position: absolute; top: -12px; left: 22px; font-size: 16px; opacity: 0; animation: stopshow 11s linear forwards; }
    .walk-poop { position: absolute; bottom: 2px; font-size: 17px; line-height: 1; opacity: 0; animation: ground 16s ease-out forwards; }
    .walker.ltr .walk-poop { left: calc(50% - 26px); }
    .walker.rtl .walk-poop { left: calc(50% + 18px); }
    @keyframes walk { 0% { left: -60px; } 40%, 58% { left: calc(50% - 16px); } 100% { left: calc(100% + 60px); } }
    @keyframes walk-rtl { 0% { left: calc(100% + 60px); } 40%, 58% { left: calc(50% - 16px); } 100% { left: -60px; } }
    @keyframes step { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-4px) rotate(4deg); } }
    @keyframes stopshow { 0%, 41% { opacity: 0; } 44%, 56% { opacity: 1; } 59%, 100% { opacity: 0; } }
    @keyframes ground {
      0%, 32% { opacity: 0; transform: translateY(-10px) scale(.2); }
      35% { opacity: 1; transform: scale(1.3); }
      37% { transform: scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    .party {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 130px); z-index: 30;
      display: flex; flex-direction: column; align-items: center; pointer-events: none;
      animation: party 1.9s ease-out forwards;
    }
    .party-animal { font-size: 60px; line-height: 1.1; animation: hop .4s ease-out 4 alternate; }
    .party-text {
      background: var(--accent); color: #fff; padding: 6px 16px; border-radius: 18px; font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,0,0,.18); white-space: nowrap;
    }
    .conf { position: absolute; top: 24px; font-size: 18px; animation: fly 1.2s ease-out forwards; }
    @keyframes party {
      0% { opacity: 0; transform: translate(-50%, 24px) scale(.7); }
      14% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -24px); }
    }
    @keyframes hop { to { transform: translateY(-18px) rotate(8deg); } }
    @keyframes fly { from { opacity: 1; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.1); } }

    @media (prefers-reduced-motion: reduce) {
      .walker { display: none; }
      .buddy *, .party *, .empty .mini, .logo { animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
